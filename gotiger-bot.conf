server {
        listen 80;

        server_name bot.api.gotiger.dev;

        location / {
                return 301 https://$host$request_uri? ;
        }
}

server {
        listen 443 ssl;
        server_name bot.api.gotiger.dev;

        include /etc/nginx/conf.d/ssl-conf;
        include /etc/nginx/conf.d/options-ssl-nginx;

        set $gotiger_bot_upstream "gotiger-bot-active:8020";

        # Microsoft OAuth 콜백은 clientdata 파라미터에 %7c%7c(||)가 포함되어
        # block-bots의 인코딩된 RCE 패턴에 걸린다. 이 경로만 검사에서 제외한다.
        location = /auth/minecraft/callback {
            proxy_pass http://$gotiger_bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Steam 은 OpenID 2.0 이라 openid.* 파라미터가 URL 로 잔뜩 붙어 오고
        # 값에 :// 가 들어간다. block-bots 패턴에 걸릴 수 있어 함께 제외한다.
        location = /auth/steam/callback {
            proxy_pass http://$gotiger_bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # 팰월드 모드가 보내는 입/퇴장·heartbeat.
        # 게임서버는 브라우저가 아니라 UA 기반 차단에 걸릴 수 있다.
        location /game/ {
            proxy_pass http://$gotiger_bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        location / {
            include /etc/nginx/conf.d/block-bots;

            proxy_pass http://$gotiger_bot_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
}
